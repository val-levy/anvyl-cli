[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anvyl-cli"
version = "0.1.0"
description = "Human-most-of-the-loop coding coach: the human drives, the AI navigates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Val Levy" }]
dependencies = [
    "langgraph==1.2.24",
    "langgraph-checkpoint-sqlite==3.1.3",
    "rich==15.0.0",
    "keyring>=25,<27",
]

[project.scripts]
anvyl = "anvyl.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.6",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anvyl = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# tasks.py holds long prose strings (quiz answers, hints, goal prompts)
# that read worse split across lines; line length is not enforced there.
[tool.ruff.lint.per-file-ignores]
"src/anvyl/tasks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
